name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - run: npm ci || npm install

    - run: npm run build

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - uses: android-actions/setup-android@v3

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Verify no READ_MEDIA permissions in app manifest source
      run: |
        if grep -RIn --include='AndroidManifest.xml' -E '<uses-permission[^>]*android\.permission\.READ_MEDIA_(IMAGES|VIDEO)[^>]*>' android/app/src/main | grep -v 'tools:node="remove"'; then
          echo "ERROR: READ_MEDIA permission declared without tools:node=remove"
          exit 1
        fi
        echo "OK: no active READ_MEDIA declarations"

    - run: chmod +x android/gradlew

    - name: Assemble debug APK
      run: cd android && ./gradlew assembleDebug

    - name: Verify merged release manifest has no READ_MEDIA
      run: |
        cd android
        ./gradlew :app:processReleaseMainManifest
        MANIFEST=$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -n 1)
        echo "Checking: $MANIFEST"
        if grep -E 'android\.permission\.READ_MEDIA_(IMAGES|VIDEO)' "$MANIFEST"; then
          echo "ERROR: READ_MEDIA still present in merged manifest"
          exit 1
        fi
        echo "Merged permissions:"
        grep 'uses-permission' "$MANIFEST" || true

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: carflex-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Decode release keystore
      id: keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "KEYSTORE_BASE64 secret missing — skipping signed bundle"
        else
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/carflex-release.jks
          ls -la android/app/carflex-release.jks
          echo "present=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Bundle signed release AAB
      id: bundle
      if: steps.keystore.outputs.present == 'true'
      continue-on-error: true
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -e
        test -n "$KEYSTORE_PASSWORD"
        test -n "$KEY_ALIAS"
        test -n "$KEY_PASSWORD"
        cd android
        ./gradlew bundleRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/carflex-release.jks \
          -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

    - name: Upload release AAB
      if: steps.keystore.outputs.present == 'true' && steps.bundle.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: carflex-release-aab
        path: android/app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: warn

    - name: Warn if signed AAB failed
      if: steps.keystore.outputs.present == 'true' && steps.bundle.outcome != 'success'
      run: |
        echo "::warning::Signed AAB failed (check KEYSTORE_* secrets / alias). Debug APK + READ_MEDIA checks still passed."
